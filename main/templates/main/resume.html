{% extends 'main/base.html' %}
{% load static %}
{% block content %}

<section class="min-h-screen bg-slate-950 text-white py-24">
    <div class="max-w-5xl mx-auto px-6 text-center">

        <h2 class="text-4xl font-bold text-cyan-400 mb-12">
            My Resume
        </h2>

        <!-- Download Button -->
        <a href="{% static 'files/Deepanshu_Patyal.pdf' %}" download
           class="px-8 py-3 bg-purple-600 hover:bg-purple-500 rounded-full text-white font-semibold shadow-lg transition duration-300">
            Download Resume
        </a>

        <!-- PDF Viewer -->
        <div class="mt-12 border border-cyan-500/20 rounded-2xl overflow-hidden">
            <iframe src="{% static 'files/Deepanshu_Patyal.pdf' %}" 
                    class="w-full h-[800px]">
            </iframe>
        </div>

    </div>
</section>

{% endblock %}
